<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Iframe redimensionnable et déplaçable</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #000;
    height: 100%;
    overflow: hidden;
  }
  #draggable-iframe {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 60%;
    height: 140px;
    border: 0;
    resize: both; /* pour redimensionner avec la souris (optionnel) */
    overflow: auto;
    touch-action: none; /* pour gérer les événements tactiles */
    cursor: grab;
  }
</style>
</head>
<body>

<iframe id="draggable-iframe" src="https://text-on-tap.live/captionex.html?e=testevent"></iframe>

<script>
  const iframe = document.getElementById('draggable-iframe');

  let isDragging = false;
  let startX, startY, startLeft, startTop;

  // Fonction pour démarrer le déplacement
  iframe.addEventListener('touchstart', (e) => {
    isDragging = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startLeft = parseInt(window.getComputedStyle(iframe).left, 10);
    startTop = parseInt(window.getComputedStyle(iframe).top, 10);
    iframe.style.cursor = 'grabbing';
    e.preventDefault();
  }, {passive: false});

  // Fonction pour déplacer
  iframe.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    iframe.style.left = (startLeft + dx) + 'px';
    iframe.style.top = (startTop + dy) + 'px';
    e.preventDefault();
  }, {passive: false});

  // Fonction pour arrêter le déplacement
  iframe.addEventListener('touchend', () => {
    isDragging = false;
    iframe.style.cursor = 'grab';
  });

  // Optionnel : ajouter une poignée pour redimensionner
  // ou utiliser CSS resize si vous souhaitez une redimension automatique
</script>

</body>
</html>
